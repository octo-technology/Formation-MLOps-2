[project]
name = "formation-mlops-2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "apache-airflow>=3.3.0",
    "joblib>=1.5.3",
    "mlflow==3.14",
    "pandas==2.3.3",
    "protobuf==7.35.1",
    "psycopg2-binary>=2.9.12",
    "pyarrow>=24.0.0",
    "scikit-learn>=1.9.0",
    "sqlalchemy>=2.0.51",
    "streamlit>=1.59.1",
]

[dependency-groups]
dev = [
    "behave>=1.3.3",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.21",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "A",    # flake8-builtins
    "N",    # pep8-naming
    "ISC",  # flake8-implicit-str-concat
    "ERA",  # eradicate (commented-out code)
    "T20",  # flake8-print
    "PIE",  # flake8-pie
    "RUF",  # ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
# scripts/dags/exposition sont des entrypoints, pas des packages importables
"scripts/**" = ["INP001", "T201"]
"dags/**" = ["INP001", "T201"]
"exposition/**" = ["INP001", "T201"]
# assert et print sont normaux dans les tests (pytest, debug)
"tests/**" = ["S101", "T201"]
