name: Build and Deploy

on:
  push:
    branches:
      - dev

permissions:
  contents: read
  pages: write
  id-token: write


jobs:
  build-pages:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Get claat
        run: |
          wget https://github.com/googlecodelabs/tools/releases/download/v2.0.2/claat-linux-amd64
          chmod +x claat-linux-amd64 
          
      - name: Run claat
        run: |
          cd TP_instructions
          ../claat-linux-amd64 export tp*.md
          sed -i 's/codelab-elements\//codelab-elements-tmp\//' tp*/index.html # Tmp fix linked to an issue with codelab elements see https://github.com/googlecodelabs/tools/issues/796

      - name: Point the Done and close buttons to the next TP or to the repo
        run: |
          cd TP_instructions
          for page in tp*/index.html; do
            number=$(dirname "$page" | tr -dc '0-9')
            next="tp$((number + 1))"
            next_attribute=""
            if [ -d "$next" ]; then
              next_attribute=" data-next=\"../$next/\""
            fi
            sed -i "s|</body>|<script src=\"../codelab-links.js\"$next_attribute></script></body>|" "$page"
          done

      - name: Create public directory
        run: mkdir _site

      - name: Copy files to public directory
        run: | 
          cp -r TP_instructions/* _site
          ls _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
